<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#352f2b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
  <title>ReMaPro — Écran client</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#27231f;background:#f3eee6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f5f0e8,#ebe2d5)}main{width:min(980px,100%);margin:auto;padding:32px;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:24px}.head{display:flex;justify-content:space-between;align-items:end}.head h1{margin:0;font-size:clamp(28px,5vw,54px)}.meta{color:#766d64}.items{background:#fffaf4;border:1px solid #d8cec1;border-radius:24px;padding:20px;align-self:start}.line{display:grid;grid-template-columns:auto 1fr auto;gap:18px;padding:16px 4px;border-bottom:1px solid #ebe3d9;font-size:clamp(18px,3vw,28px)}.line:last-child{border-bottom:0}.qty{font-weight:800}.note{display:block;color:#766d64;font-size:.65em;margin-top:4px}.empty{display:grid;place-items:center;min-height:40vh;color:#766d64;font-size:clamp(20px,4vw,36px)}.total{display:flex;justify-content:space-between;align-items:center;background:#352f2b;color:white;border-radius:24px;padding:22px 28px;font-size:clamp(28px,6vw,58px);font-weight:900}.status{font-size:13px;color:#766d64;text-align:right}@media(max-width:600px){main{padding:18px}.line{grid-template-columns:auto 1fr}.line strong:last-child{grid-column:2}.head{align-items:start;flex-direction:column;gap:6px}}
  </style>
</head>
<body><main><header class="head"><div><div class="meta">ReMaPro POS</div><h1 id="restaurant">Restaurant</h1></div><div class="status" id="status">En attente de la caisse…</div></header><section class="items" id="items"><div class="empty">Votre commande s’affichera ici.</div></section><footer class="total"><span>Total</span><span id="total">CHF 0.00</span></footer></main><script type="module" src="./src/customer-display-page.js"></script></body>
</html>
