name: Package ReMaPro Hub V27.11.0 delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/remaprohub-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate V27.11.0 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version":"27.11.0"' package.json
          grep -q "APP_VERSION='27.11.0'" src/app.js
          test -f src/security.js
          test -f src/billing.js
          test -f src/intelligence.js
          test -f supabase/migrations/006_v27_10_private_auth_helpers.sql
          test -f supabase/functions/remapro-bootstrap/index.ts
          test -f .github/workflows/build-android-v27-11.yml
          npm install
          npm test
      - name: Create READY ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r ReMaPro_Hub_V27_11_0_READY.zip .             -x '.git/*'                'node_modules/*'                'android/*'                'ReMaPro_Hub_V27_11_0_READY.zip'                '.github/final-build-trigger'
          test -s ReMaPro_Hub_V27_11_0_READY.zip
          unzip -t ReMaPro_Hub_V27_11_0_READY.zip
          sha256sum ReMaPro_Hub_V27_11_0_READY.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro_Hub_V27_11_0_READY
          path: ReMaPro_Hub_V27_11_0_READY.zip
          if-no-files-found: error
