name: Android ReMaPro Hub V27
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - name: Verify packaged web runtime
        run: |
          test -s app/sw.js
          test -s app/src/app.js
          test -s app/src/i18n.js
          test -s app/src/store.js
      - run: npx cap add android
      - name: Stamp Android version
        run: node scripts/stamp-android-version.mjs
      - name: Apply immersive Android activity
        run: |
          install -m 644 android-native/MainActivity.java android/app/src/main/java/com/remaprohub/app/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.systemBars()' android/app/src/main/java/com/remaprohub/app/MainActivity.java
      - run: npx cap sync android
      - name: Apply ReMaPro Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          install -m 644 app/assets-remaprohub-logo.png android/app/src/main/res/drawable-nodpi/remaprohub_logo.png
          install -m 644 android-native/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          install -m 644 android-native/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          install -m 644 android-native/remaprohub_colors.xml android/app/src/main/res/values/remaprohub_colors.xml
          grep -q '@drawable/remaprohub_logo' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@color/remaprohub_icon_bg' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Verify packaged runtime
        run: |
          test -s android/app/src/main/assets/public/src/app.js
          test -s android/app/src/main/assets/public/src/i18n.js
          test -s android/app/src/main/assets/public/src/store.js
          grep -q 'src/app.js' android/app/src/main/assets/public/index.html
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-Hub-V27.0.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
