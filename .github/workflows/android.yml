name: Android ReMaPro Hub V27
on:
  push:
    branches: [rebuild/remaprohub-clean]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - name: Package web runtime
        run: |
          rm -rf app/src
          mkdir -p app/src
          cp src/*.js app/src/
          test -s app/src/app.js
          test -s app/src/i18n.js
          test -s app/src/store.js
          sed -i 's#../src/app.js#src/app.js#g' app/index.html
          grep -q 'src/app.js' app/index.html
      - run: npx cap add android
      - run: npx cap sync android
      - name: Verify packaged runtime
        run: |
          test -s android/app/src/main/assets/public/src/app.js
          test -s android/app/src/main/assets/public/src/i18n.js
          test -s android/app/src/main/assets/public/src/store.js
          grep -q 'src/app.js' android/app/src/main/assets/public/index.html
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-Hub-V27-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
