name: Deploy ReMaPro Hub website to Infomaniak

on:
  workflow_dispatch:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/deploy-infomaniak-trigger'

permissions:
  contents: read

concurrency:
  group: remaprohub-infomaniak-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public website
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Verify website files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s logo.png
          grep -q "La gestion quotidienne de votre restaurant, simplifiée" index.html

      - name: Deploy website to Infomaniak FTP
        shell: bash
        env:
          FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.INFOMANIAK_FTP_PORT }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            remote="${file#./}"
            case "$remote" in
              .git/*|CNAME) continue ;;
            esac
            echo "Uploading $remote"
            curl --fail --silent --show-error --ftp-create-dirs               --user "$FTP_USER:$FTP_PASSWORD"               --upload-file "$file"               "ftp://$FTP_HOST:$FTP_PORT/$remote"
          done < <(find . -type f -print0)

      - name: Deployment summary
        run: |
          echo "ReMaPro Hub website uploaded to Infomaniak."
          echo "Source branch: gh-pages"
