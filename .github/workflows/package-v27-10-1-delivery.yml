name: Package ReMaPro Hub V27.10.1 delivery
on:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/delivery-v27-10-1-trigger'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V27.10.1 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version":"27.10.0"' package.json
          grep -q "APP_VERSION='27.10.0'" src/app.js
          test -f src/security.js
          test -f supabase/migrations/004_v27_10_security_accounts_audit.sql
          test -f supabase/migrations/005_v27_10_permission_alignment.sql
          test -f supabase/migrations/006_v27_10_private_auth_helpers.sql
          test -f supabase/functions/remapro-bootstrap/index.ts
          test -f .github/workflows/install-v27-10-1.yml
          test -f .github/workflows/build-android-v27-10-1.yml
      - name: Create READY ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r ReMaPro_Hub_V27_10_1_READY.zip .             -x '.git/*'                'node_modules/*'                'android/*'                'ReMaPro_Hub_V27_10_1_READY.zip'                '.github/final-build-trigger'                '.github/test-v27-10-1-trigger'                '.github/delivery-v27-10-1-trigger'                '.github/deploy-v27-10-1-trigger'                '.github/workflows/package-v27-10-1-delivery.yml'
          test -s ReMaPro_Hub_V27_10_1_READY.zip
          unzip -t ReMaPro_Hub_V27_10_1_READY.zip
          sha256sum ReMaPro_Hub_V27_10_1_READY.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro_Hub_V27_10_1_READY
          path: ReMaPro_Hub_V27_10_1_READY.zip
          if-no-files-found: error
