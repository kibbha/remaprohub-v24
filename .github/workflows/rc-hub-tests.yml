name: RC Hub test suite

on:
  workflow_dispatch:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/rc-hub-tests.trigger'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/remaprohub-clean
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate optional RevenueCat runtime injection
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          REQUIRE_REVENUECAT: '0'
        run: |
          node scripts/inject-runtime-config.mjs
          if [ -n "$REVENUECAT_ANDROID_API_KEY" ]; then
            grep -Eq "REMAPRO_REVENUECAT_ANDROID_API_KEY=['\"][^'\"]+" app/runtime-config.js
          else
            echo "RevenueCat Android key not configured; billing remains disabled in the test APK."
          fi
      - name: Run full Hub test suite
        run: npm test
      - name: Verify RC runtime additions
        if: always()
        run: |
          test -s app/src/accounting.js
          test -s app/src/integrations.js
          test -s app/src/floor-plan.js
          grep -q "kioskMode=qs.get('kiosk')==='1'" app/order.js
          grep -q "scheduleKioskReset" app/order.js
          grep -q "integrationAdapterRegistry" src/app.js
          grep -q "profitLeakCockpit" src/app.js
          grep -q "accountingExportForm" src/app.js
