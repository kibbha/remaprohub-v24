name: RC Hub test suite

on:
  workflow_dispatch:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/rc-hub-tests.trigger'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/remaprohub-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate RevenueCat runtime injection
        id: revenuecat
        continue-on-error: true
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          REQUIRE_REVENUECAT: '1'
        run: |
          node scripts/inject-runtime-config.mjs
          node -e "const fs=require('fs');const s=fs.readFileSync('app/runtime-config.js','utf8');if(!/REMAPRO_REVENUECAT_ANDROID_API_KEY=['\"][^'\"]+/.test(s))process.exit(1)"
      - name: Run full Hub test suite
        run: npm test
      - name: Fail RC if RevenueCat is not configured
        if: steps.revenuecat.outcome != 'success'
        run: |
          echo "RevenueCat Android key is not configured in GitHub Actions secrets."
          exit 1
      - name: Verify RC runtime additions
        if: always() && steps.revenuecat.outcome == 'success'
        run: |
          test -s app/src/accounting.js
          test -s app/src/integrations.js
          grep -q "kioskMode=qs.get('kiosk')==='1'" app/order.js
          grep -q "scheduleKioskReset" app/order.js
          grep -q "integrationAdapterRegistry" src/app.js
          grep -q "profitLeakCockpit" src/app.js
          grep -q "accountingExportForm" src/app.js
