name: ReMaPro Ops Node CI

on:
  pull_request:
    branches:
      - ops/remapro-ops
    paths:
      - 'src/app.js'
      - 'src/cloud.js'
      - 'app/styles.css'
      - 'package.json'
      - 'tests/ops-app.test.mjs'
      - '.github/workflows/ops-node-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ReMaPro Ops tests
        run: npm test
