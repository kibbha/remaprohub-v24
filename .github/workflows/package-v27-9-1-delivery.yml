name: Package ReMaPro Hub V27.9.1 delivery
on:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/delivery-v27-9-1-trigger'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact delivery source
        uses: actions/checkout@v4
      - name: Validate V27.9.1 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version":"27.9.1"' package.json
          grep -q "APP_VERSION='27.9.1'" src/app.js
          test -f .github/workflows/install-v27-9-1.yml
          test -f .github/workflows/build-android-v27-9-1.yml
      - name: Create READY ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -r ReMaPro_Hub_V27_9_1_READY.zip . \
            -x '.git/*' \
               'node_modules/*' \
               'android/*' \
               'ReMaPro_Hub_V27_9_1_READY.zip' \
               '.github/final-build-trigger' \
               '.github/delivery-package-trigger' \
               '.github/delivery-v27-9-1-trigger' \
               '.github/test-v27-9-trigger' \
               '.github/workflows/package-v27-9-1-delivery.yml'
          test -s ReMaPro_Hub_V27_9_1_READY.zip
          unzip -t ReMaPro_Hub_V27_9_1_READY.zip
          sha256sum ReMaPro_Hub_V27_9_1_READY.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro_Hub_V27_9_1_READY
          path: ReMaPro_Hub_V27_9_1_READY.zip
          if-no-files-found: error
