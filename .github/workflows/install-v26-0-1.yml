name: Verify ReMaPro Hub V26.0.1 Android source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main without rewriting it
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Test canonical i18n source
        working-directory: native
        run: npm run test:i18n
      - name: Create and synchronize a fresh Android project
        working-directory: native
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android
      - name: Prove Android receives the canonical runtime
        working-directory: native
        run: npm run test:android-assets
