name: AI Operations Node CI

on:
  pull_request:
    branches:
      - rebuild/remaprohub-clean
      - pos/remapro-pos

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Node test suite
        run: npm test
