name: Android ReMaPro Hub V26.0.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v5
      - name: Verify V26.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html; test -f app/manifest.json; test -f app/sw.js; test -f native/package.json; test -f native/capacitor.config.ts
          grep -q "APP_VERSION='26.0.1'" app/index.html
          ! grep -q 'window.location.replace' app/index.html
          ! grep -q 'rmp_lang' app/index.html
          ! grep -Eq 'id="(appLanguage|profileLanguage)"[^>]*onchange=' app/index.html
          node tests/i18n-static.test.mjs
          node tests/i18n-coverage.test.mjs
          node tests/i18n-runtime.test.mjs
          node tests/i18n-dom.test.mjs
          grep -q 'sw.js?v=26.0.1' app/index.html
          grep -q "const CACHE='remaprohub-v26-0-1'" app/sw.js
          grep -q '"version": "26.0.1"' app/manifest.json
          grep -q '"version": "26.0.1"' native/package.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('app/index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',h,re.I); Path('/tmp/rmp.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/rmp.js
          bash -n native/scripts/prepare-android.sh
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package.json
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Create fresh Android project
        working-directory: native
        run: rm -rf android && npx cap add android && test -f android/gradlew
      - name: Generate Android assets
        working-directory: native
        run: npx @capacitor/assets@3.0.5 generate --android --assetPath assets
      - name: Apply Android fullscreen configuration
        working-directory: native
        run: bash scripts/prepare-android.sh
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android
      - name: Set Android version
        working-directory: native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle'); s=p.read_text(encoding='utf-8'); s=re.sub(r'versionCode\s+\d+','versionCode 26001',s,count=1); s=re.sub(r'versionName\s+"[^"]+"','versionName "26.0.1"',s,count=1); p.write_text(s,encoding='utf-8')
          PY
      - name: Build debug APK
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ReMaPro-Hub-V26.0.1-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
