name: Pre-launch Hub Node CI

on:
  pull_request:
    branches:
      - rebuild/remaprohub-clean
    paths:
      - 'src/**'
      - 'app/**'
      - 'supabase/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/prelaunch-hub-ci.yml'

permissions:
  contents: read

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full Hub pre-launch test suite
        run: npm test
