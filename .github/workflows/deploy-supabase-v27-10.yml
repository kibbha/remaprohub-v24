name: Deploy Supabase ReMaPro Hub V27.10
on:
  workflow_dispatch:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/deploy-v27-10-trigger'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: gkbzawjlmwjweuqckuxm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/remaprohub-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 2; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not configured"; exit 2; }
          test "$SUPABASE_PROJECT_REF" = "gkbzawjlmwjweuqckuxm"
      - name: Link exact ReMaPro Hub project
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: npx --yes supabase@latest db push --linked --include-all
      - name: Deploy manager account administration
        run: npx --yes supabase@latest functions deploy remapro-admin --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify deployed function list
        run: npx --yes supabase@latest functions list --project-ref "$SUPABASE_PROJECT_REF"
