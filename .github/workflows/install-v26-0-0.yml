name: Install ReMaPro Hub V26.0.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install canonical V26.0.0 payload
        run: |
          set -euo pipefail
          PAYLOAD="releases/ReMaPro_Hub_V26_0_0_SOURCE.zip"
          test -s "$PAYLOAD" || { echo 'ERROR: canonical payload missing. Use the READY package and extract it into the repository first.'; exit 1; }
          rm -rf /tmp/remapro-v26-release
          mkdir -p /tmp/remapro-v26-release
          unzip -q "$PAYLOAD" -d /tmp/remapro-v26-release
          test -f /tmp/remapro-v26-release/app/index.html
          test -f /tmp/remapro-v26-release/native/package.json
          rsync -a --delete --exclude='.git/' --exclude='releases/' /tmp/remapro-v26-release/ ./
          echo 'Canonical V26.0.0 payload installed.'

      - name: Verify canonical V26.0.0 source
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f app/sw.js
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f native/scripts/prepare-android.sh
          grep -q "APP_VERSION='26.0.0'" app/index.html
          grep -q 'id="appLanguage" data-rmp-language-selector' app/index.html
          ! grep -q 'id="appLanguage".*onchange=' app/index.html
          grep -q "const urlLang=new URLSearchParams(location.search).get('lang')" app/index.html
          grep -q 'function bindLanguageSelectors' app/index.html
          grep -q 'function startLanguageObserver' app/index.html
          grep -q 'sw.js?v=26.0.0' app/index.html
          grep -q 'remaprohub-v26-0-0' app/sw.js
          grep -q '"version": "26.0.0"' app/manifest.json
          grep -q '"version": "26.0.0"' native/package.json
          grep -q 'WindowInsets.Type.navigationBars()' native/scripts/prepare-android.sh
          grep -q 'WindowInsets.Type.statusBars()' native/scripts/prepare-android.sh
          ! grep -q 'onResume' native/scripts/prepare-android.sh
          python3 - <<'PY2'
          from pathlib import Path
          import json,re
          html=Path('app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I)
          Path('/tmp/remapro-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          m=json.loads(Path('app/manifest.json').read_text(encoding='utf-8'))
          p=json.loads(Path('native/package.json').read_text(encoding='utf-8'))
          assert m['version']=='26.0.0'
          assert p['version']=='26.0.0'
          assert 'onchange="setAppLanguage(this.value)"' not in html
          assert "const urlLang=new URLSearchParams(location.search).get('lang')" in html
          print('Canonical source assertions: PASS')
          print(f'Inline script blocks: {len(scripts)}')
          PY2
          node --check /tmp/remapro-inline.js
          bash -n native/scripts/prepare-android.sh

      - name: Commit canonical V26.0.0 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already canonical V26.0.0.'
          else
            git commit -m 'ReMaPro Hub V26.0.0 rebuild'
            git push origin HEAD:main
          fi
