name: Install ReMaPro Hub V26.0.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rebuild V26.0.0 from repository source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html || { echo 'ERROR: app/index.html is missing.'; exit 1; }
          test -f app/manifest.json || { echo 'ERROR: app/manifest.json is missing.'; exit 1; }
          test -f app/sw.js || { echo 'ERROR: app/sw.js is missing.'; exit 1; }
          test -f native/package.json || { echo 'ERROR: native/package.json is missing.'; exit 1; }
          python3 - <<'PY2'
          from pathlib import Path
          import json,re

          root=Path('.')
          hp=root/'app/index.html'
          html=hp.read_text(encoding='utf-8')

          # Canonical version.
          html=re.sub(r"APP_VERSION\s*=\s*['\"][^'\"]+['\"]", "APP_VERSION='26.0.0'", html, count=1)

          # Stable language selector: remove inline onchange and add marker.
          def fix_selector(m):
              tag=m.group(0)
              tag=re.sub(r"\s+onchange\s*=\s*(?:\"[^\"]*\"|'[^']*')",'',tag,flags=re.I)
              if not re.search(r"\bdata-rmp-language-selector(?:\s*=|\s|>)",tag,re.I):
                  tag=tag[:-1]+' data-rmp-language-selector>'
              return tag
          html=re.sub(r"<select\b[^>]*\bid=[\"']appLanguage[\"'][^>]*>",fix_selector,html,count=1,flags=re.I)

          # Deterministic SW cache-buster.
          html=re.sub(r"sw\.js\?v=[0-9.]+",'sw.js?v=26.0.0',html)

          # Inject missing language infrastructure instead of failing on older source.
          marker='/* RMP V26 LANGUAGE RUNTIME */'
          if marker not in html:
              runtime=__import__('base64').b64decode('').decode()
              idx=html.rfind('boot();')
              if idx<0: idx=html.rfind('</script>')
              if idx<0: raise SystemExit('ERROR: no boot call or closing script tag in app/index.html')
              html=html[:idx]+runtime+'\n'+html[idx:]

          hp.write_text(html,encoding='utf-8')

          mp=root/'app/manifest.json';m=json.loads(mp.read_text(encoding='utf-8'));m['version']='26.0.0';mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          np=root/'native/package.json';n=json.loads(np.read_text(encoding='utf-8'));n['version']='26.0.0';np.write_text(json.dumps(n,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          sp=root/'app/sw.js';sw=sp.read_text(encoding='utf-8');sw=re.sub(r"const CACHE\s*=\s*['\"][^'\"]+['\"]","const CACHE='remaprohub-v26-0-0'",sw,count=1);sp.write_text(sw,encoding='utf-8')

          rp=root/'index.html'
          if rp.exists():
              r=rp.read_text(encoding='utf-8');r=r.replace('ReMaPro Hub V25.9.9','ReMaPro Hub V26.0.0');rp.write_text(r,encoding='utf-8')

          (root/'update-manifest.json').write_text(json.dumps({'version':'26.0.0','title':'ReMaPro Hub V26.0.0','notes':'Reconstruction V26.0.0 avec gestion de langue renforcée et pipeline Android unifié.','apkUrl':''},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Remove obsolete V25 workflows only after successful source modification.
          wf=root/'.github/workflows'
          if wf.exists():
              for p in wf.glob('*v25*.yml'):p.unlink()
          print('V26.0.0 rebuild completed.')
          PY2

      - name: Verify V26.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f app/sw.js
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f native/scripts/prepare-android.sh
          python3 - <<'PY2'
          from pathlib import Path
          import json,re
          h=Path('app/index.html').read_text(encoding='utf-8')
          assert "APP_VERSION='26.0.0'" in h
          assert 'RMP V26 LANGUAGE RUNTIME' in h
          assert re.search(r'<select\b[^>]*\bid=["\']appLanguage["\'][^>]*data-rmp-language-selector',h,re.I)
          assert not re.search(r'<select\b[^>]*\bid=["\']appLanguage["\'][^>]*\bonchange\s*=',h,re.I)
          assert 'sw.js?v=26.0.0' in h
          assert 'window.setAppLanguage=function' in h or 'function setAppLanguage' in h
          assert 'window.bindLanguageSelectors=function' in h or 'function bindLanguageSelectors' in h
          assert 'window.startLanguageObserver=function' in h or 'function startLanguageObserver' in h
          assert 'remaprohub-v26-0-0' in Path('app/sw.js').read_text(encoding='utf-8')
          assert json.loads(Path('app/manifest.json').read_text(encoding='utf-8')).get('version')=='26.0.0'
          assert json.loads(Path('native/package.json').read_text(encoding='utf-8')).get('version')=='26.0.0'
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',h,re.I)
          Path('/tmp/remapro-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('V26.0.0 source assertions: PASS')
          PY2
          node --check /tmp/remapro-inline.js
          bash -n native/scripts/prepare-android.sh

      - name: Commit V26.0.0 rebuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V26.0.0 source already clean.'
          else
            git commit -m 'ReMaPro Hub V26.0.0 clean rebuild'
            git push origin HEAD:main
          fi
