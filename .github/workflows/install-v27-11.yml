name: Install ReMaPro Hub V27.11.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/remaprohub-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate installable V27.11.0 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"version":"27.11.0"' package.json
          grep -q "APP_VERSION='27.11.0'" src/app.js
          test -f capacitor.config.json
          test -f src/security.js
          test -f src/billing.js
          test -f src/cloud.js
          test -f src/intelligence.js
          npm install
          npm run pack:web
          npm test
          echo "V27.11.0 source is ready for Android packaging."
