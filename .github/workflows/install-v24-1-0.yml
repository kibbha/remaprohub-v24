name: Install V24.1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ReMaPro_Hub_V24_1_0_READY.zip"
          test -f "$ZIP"
          unzip -t "$ZIP" >/dev/null
          rm -rf /tmp/remapro
          mkdir -p /tmp/remapro
          unzip -q "$ZIP" -d /tmp/remapro
          APP_INDEX=$(find /tmp/remapro -type f -path '*/app/index.html' -print -quit)
          test -n "$APP_INDEX"
          ROOT=$(dirname "$(dirname "$APP_INDEX")")
          test -f "$ROOT/app/manifest.json"
          test -f "$ROOT/app/sw.js"
          test -f "$ROOT/native/package.json"
          grep -q '24.1.0' "$ROOT/app/index.html"
          grep -q '24.1.0' "$ROOT/native/package.json"
          grep -q '"typescript"' "$ROOT/native/package.json"
          echo "Package V24.1.0 OK: $ROOT"

      - name: Install clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/remapro
          mkdir -p /tmp/remapro
          unzip -q ReMaPro_Hub_V24_1_0_READY.zip -d /tmp/remapro
          APP_INDEX=$(find /tmp/remapro -type f -path '*/app/index.html' -print -quit)
          ROOT=$(dirname "$(dirname "$APP_INDEX")")
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$ROOT/." .
          rm -f ReMaPro_Hub_V24_1_0_READY.zip

      - name: Verify installed source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f app/sw.js
          test -f native/package.json
          test -f native/capacitor.config.ts
          grep -q '24.1.0' app/index.html
          grep -q 'function newHaccp' app/index.html
          grep -q 'function newTeam' app/index.html
          grep -q 'function newRecipe' app/index.html
          grep -q 'function newPurchase' app/index.html
          grep -q 'function newTrace' app/index.html
          grep -q 'function newWaste' app/index.html
          grep -q 'function newReservation' app/index.html
          grep -q '24.1.0' native/package.json
          grep -q 'remaprohub-v24-1-0' app/sw.js
          grep -q 'remaprohub-data-v24-1-0' app/index.html
          grep -q '"typescript"' native/package.json
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/remapro.js').write_text(js)
          PY
          node --check /tmp/remapro.js

      - name: Commit V24.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ReMaPro Hub V24.1.0 clean foundation"
          git push origin HEAD:main
