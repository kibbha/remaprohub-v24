name: Android ReMaPro Hub V25.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f native/scripts/prepare-android.sh
          grep -q "APP_VERSION='25.5.0'" app/index.html
          grep -q 'function goBack' app/index.html
          grep -q 'function goHome' app/index.html
          grep -q 'pageBackBtn' app/index.html
          grep -q 'WindowInsets.Type.navigationBars' native/scripts/prepare-android.sh
          grep -q 'WindowInsets.Type.statusBars' native/scripts/prepare-android.sh
          grep -q '"display": "fullscreen"' app/manifest.json

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor toolchain
        working-directory: native
        run: |
          npx tsc --version
          npx cap --version

      - name: Create fresh Android project
        working-directory: native
        run: |
          rm -rf android
          npx cap add android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Enable Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v25-5-${{ hashFiles('native/android/**/*.gradle*', 'native/android/**/gradle-wrapper.properties', 'native/android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v25-5-
            ${{ runner.os }}-gradle-

      - name: Prepare Android immersive fullscreen
        working-directory: native
        run: bash scripts/prepare-android.sh

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Validate Android XML and fullscreen activity
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          ET.parse(manifest)
          activity=Path('android/app/src/main/java/com/remaprohub/app/MainActivity.java')
          text=activity.read_text(encoding='utf-8')
          assert 'WindowInsets.Type.navigationBars()' in text
          assert 'WindowInsets.Type.statusBars()' in text
          assert 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' in text
          print('Android manifest XML: PASS')
          print('Immersive activity: PASS')
          PY

      - name: Set Android version
        working-directory: native
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 25500',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "25.5.0"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s native/android/app/build/outputs/apk/debug/app-debug.apk
          file native/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ReMaPro-Hub-V25.5-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
