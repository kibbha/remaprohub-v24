name: Android ReMaPro Hub V25.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f native/scripts/prepare-android.sh
          grep -q "APP_VERSION='25.2.0'" app/index.html
          grep -q 'function ensureSubscriptionState' app/index.html
          grep -q 'function openStockVision' app/index.html
          grep -q '<section id="help" class="view"' app/index.html
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Verify Capacitor toolchain
        working-directory: native
        run: |
          npx tsc --version
          npx cap --version
      - name: Create clean Android project
        working-directory: native
        run: |
          rm -rf android
          npx cap add android
      - name: Prepare Android manifest and camera
        working-directory: native
        run: bash scripts/prepare-android.sh
      - name: Sync Capacitor web assets
        working-directory: native
        run: npx cap sync android
      - name: Validate Android manifest
        working-directory: native
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('android/app/src/main/AndroidManifest.xml')
          ET.parse(p)
          s=p.read_text(encoding='utf-8')
          assert 'android.permission.CAMERA' in s
          print('AndroidManifest.xml: XML valide + caméra présente')
          PY
      - name: Set Android version
        working-directory: native
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 25200',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "25.2.0"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ReMaPro-Hub-V25.2-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
