name: Deploy Supabase ReMaPro Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: gkbzawjlmwjweuqckuxm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/remaprohub-clean

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 2; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not configured"; exit 2; }
          test "$SUPABASE_PROJECT_REF" = "gkbzawjlmwjweuqckuxm"

      - name: Link exact ReMaPro Hub project
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify linked migration history
        run: npx --yes supabase@latest migration list --linked

      - name: Deploy authenticated Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for fn in remapro-admin remapro-sync remapro-account remapro-ai remapro-bootstrap; do
            npx --yes supabase@latest functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deploy public callback/webhook Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy remapro-revenuecat-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx --yes supabase@latest functions deploy remapro-auth-return --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify deployed function list
        run: npx --yes supabase@latest functions list --project-ref "$SUPABASE_PROJECT_REF"
