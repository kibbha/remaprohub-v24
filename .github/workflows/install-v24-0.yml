name: Install V24.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate clean package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="ReMaPro_Hub_V24_0_READY.zip"

          test -f "$ZIP" || {
            echo "Package manquant: $ZIP"
            ls -la
            exit 1
          }

          unzip -t "$ZIP" >/dev/null

          rm -rf /tmp/remapro-v24
          mkdir -p /tmp/remapro-v24

          unzip -q "$ZIP" -d /tmp/remapro-v24

          APP_INDEX=$(find /tmp/remapro-v24 -type f -path '*/app/index.html' -print -quit)

          test -n "$APP_INDEX" || {
            echo "app/index.html introuvable"
            find /tmp/remapro-v24 -maxdepth 4 -type f | head -100
            exit 1
          }

          ROOT=$(dirname "$(dirname "$APP_INDEX")")

          test -f "$ROOT/app/manifest.json"
          test -f "$ROOT/app/sw.js"

          grep -q "24.0.0" "$ROOT/app/index.html"
          grep -q "remaprohub-data-v24" "$ROOT/app/index.html"

          test -
