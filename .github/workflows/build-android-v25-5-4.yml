name: Android ReMaPro Hub V25.5.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify source
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f native/scripts/prepare-android.sh
          grep -q "APP_VERSION='25.5.4'" app/index.html
          grep -q 'function goBack' app/index.html
          grep -q 'function goHome' app/index.html
          grep -q 'pageBackBtn' app/index.html
          grep -q 'function openDashboardPeriodPicker' app/index.html
          grep -q 'function dashboardChartData' app/index.html
          grep -q 'salesPeriodBtn' app/index.html
          grep -q 'WindowInsets.Type.navigationBars()' native/scripts/prepare-android.sh
          grep -q 'WindowInsets.Type.statusBars()' native/scripts/prepare-android.sh
          ! grep -q 'onResume' native/scripts/prepare-android.sh
          grep -q '"display": "fullscreen"' app/manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          Path('/tmp/remapro-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'Inline script blocks checked: {len(scripts)}')
          PY
          node --check /tmp/remapro-inline.js
          bash -n native/scripts/prepare-android.sh
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Verify Capacitor toolchain
        working-directory: native
        run: |
          npx tsc --version
          npx cap --version
      - name: Create fresh Android project
        working-directory: native
        run: |
          rm -rf android
          npx cap add android
          test -f android/gradlew
      - name: Generate native assets
        working-directory: native
        run: npx @capacitor/assets generate --android --assetPath assets
      - name: Prepare Android immersive fullscreen
        working-directory: native
        run: bash scripts/prepare-android.sh
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android
      - name: Validate Android activity
        working-directory: native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          p=Path('android/app/src/main/java/com/remaprohub/app/MainActivity.java')
          t=p.read_text(encoding='utf-8')
          assert 'onResume' not in t
          assert 'onWindowFocusChanged' in t
          assert 'WindowInsets.Type.navigationBars()' in t
          assert 'WindowInsets.Type.statusBars()' in t
          print('Android XML and fullscreen activity: PASS')
          PY
      - name: Set Android version
        working-directory: native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 25503',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "25.5.4"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ReMaPro-Hub-V25.5.4-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
