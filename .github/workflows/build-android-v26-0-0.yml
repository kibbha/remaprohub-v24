name: Android ReMaPro Hub V26.0.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify V26.0.0 source before Android build
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f app/sw.js
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f native/scripts/prepare-android.sh
          grep -q "APP_VERSION='26.0.0'" app/index.html
          grep -Eq 'function setAppLanguage|window\.setAppLanguage=function' app/index.html
          grep -Eq 'function bindLanguageSelectors|window\.bindLanguageSelectors=function' app/index.html
          grep -q "const urlLang=new URLSearchParams(location.search).get('lang')" app/index.html
          grep -q 'sw.js?v=26.0.0' app/index.html
          grep -q 'remaprohub-v26-0-0' app/sw.js
          grep -q '"version": "26.0.0"' app/manifest.json
          grep -q '"version": "26.0.0"' native/package.json
          ! grep -q 'id="appLanguage".*onchange=' app/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          html=Path('app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html,flags=re.I)
          Path('/tmp/remapro-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          json.loads(Path('app/manifest.json').read_text(encoding='utf-8'))
          json.loads(Path('native/package.json').read_text(encoding='utf-8'))
          print('Web source checks: PASS')
          PY
          node --check /tmp/remapro-inline.js
          bash -n native/scripts/prepare-android.sh

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native/package.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor toolchain
        working-directory: native
        run: |
          node --version
          npm --version
          npx tsc --version
          npx cap --version

      - name: Create fresh Android project
        working-directory: native
        run: |
          rm -rf android
          npx cap add android
          test -f android/gradlew

      - name: Generate Android assets
        working-directory: native
        run: npx @capacitor/assets@3.0.5 generate --android --assetPath assets

      - name: Apply Android fullscreen configuration
        working-directory: native
        run: bash scripts/prepare-android.sh

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Validate Android project
        working-directory: native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          p=Path('android/app/src/main/java/com/remaprohub/app/MainActivity.java')
          t=p.read_text(encoding='utf-8')
          assert 'onWindowFocusChanged' in t
          assert 'WindowInsets.Type.navigationBars()' in t
          assert 'WindowInsets.Type.statusBars()' in t
          assert 'onResume' not in t
          print('Android XML/activity checks: PASS')
          PY

      - name: Set Android version
        working-directory: native
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 26000',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "26.0.0"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s native/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ReMaPro-Hub-V26.0.0-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
