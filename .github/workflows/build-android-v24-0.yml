name: Android V24.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f app/index.html
          test -f native/package.json
          test -f native/capacitor.config.ts

          grep -q "24.0.0" app/index.html

          test -f app/icons/remaprohub-192.png
          test -f app/icons/remaprohub-512.png
          test -f app/icons/remaprohub-512-maskable.png

          echo "Source V24.0.0 valide"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/package.json

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Create Android project from zero
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

      - name: Generate Android assets
        working-directory: native
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --androidProject android \
            --iconBackgroundColor 3a2f28 \
            --iconBackgroundColorDark 
