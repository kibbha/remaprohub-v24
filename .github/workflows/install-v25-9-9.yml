name: Install ReMaPro Hub V25.9.9
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Upgrade source to exact V25.9.9
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          app = root / 'app' / 'index.html'
          sw = root / 'app' / 'sw.js'
          manifest = root / 'app' / 'manifest.json'
          package = root / 'native' / 'package.json'

          if not app.exists():
              raise SystemExit('ERROR: app/index.html is missing from the repository.')

          html = app.read_text(encoding='utf-8')
          m = re.search(r"const APP_VERSION='([0-9.]+)';", html)
          current = m.group(1) if m else 'unknown'
          print(f'Checked-out source version: {current}')

          if current not in {'25.9.3', '25.9.4', '25.9.5', '25.9.6', '25.9.7', '25.9.8', '25.9.9'}:
              raise SystemExit(f'ERROR: unsupported source version {current}. Expected 25.9.3, 25.9.4, 25.9.5, or 25.9.9.')

          # 1) Version bump.
          html, n = re.subn(r"const APP_VERSION='[0-9.]+';", "const APP_VERSION='25.9.9';", html, count=1)
          assert n == 1

          # 2) Make boot locale deterministic: URL ?lang= has priority over storage.
          old_lang = r"const storedLang=localStorage\.getItem\('remaprohub-language'\);if\(storedLang&&I18N\[storedLang\]\)\{d\.preferences\.language=storedLang;d\.user\.language=storedLang;\}"
          new_lang = "const urlLang=new URLSearchParams(location.search).get('lang');const storedLang=localStorage.getItem('remaprohub-language');const preferredLang=(urlLang&&I18N[urlLang])?urlLang:storedLang;if(preferredLang&&I18N[preferredLang]){d.preferences.language=preferredLang;d.user.language=preferredLang;localStorage.setItem('remaprohub-language',preferredLang);}"
          html, n = re.subn(old_lang, new_lang, html, count=1)
          if n == 0 and 'const urlLang=new URLSearchParams(location.search).get(\'lang\')' not in html:
              raise SystemExit('ERROR: could not patch loadState() language selection.')

          # 3) Replace the language handler and bind selectors outside inline HTML events.
          html = html.replace('<select id="appLanguage" onchange="setAppLanguage(this.value)">', '<select id="appLanguage" data-rmp-language-selector>')
          set_re = re.compile(r"function setAppLanguage\(lang\)\{.*?\n\}\s*function logoutLocal", re.S)
          new_set = r'''function setAppLanguage(lang){
            lang=I18N[lang]?lang:'fr';
            state.preferences=state.preferences||{};
            state.user=state.user||{};
            state.preferences.language=lang;
            state.user.language=lang;
            try{
              localStorage.setItem('remaprohub-language',lang);
              localStorage.setItem('remaprohub-data',JSON.stringify(state));
            }catch(e){console.error('language persistence',e)}
            __translationCache.clear();
            __translationReverse=null;
            document.documentElement.lang=lang;
            const ap=document.getElementById('appLanguage');
            const pl=document.getElementById('profileLanguage');
            if(ap)ap.value=lang;
            if(pl)pl.value=lang;
            // Critical order: render every module, then translate the final DOM.
            try{renderAll()}catch(e){console.error('language renderAll',e)}
            try{applyLanguage();applyFullLanguage()}catch(e){console.error('language apply',e)}
            try{updatePageNavigation()}catch(e){console.error('language navigation',e)}
            if(document.getElementById('onboarding')?.classList.contains('open')){
              try{renderOnboarding()}catch(e){console.error('onboarding language',e)}
              try{applyFullLanguage()}catch(e){console.error('onboarding translation',e)}
            }
            window.dispatchEvent(new CustomEvent('remapro:languagechange',{detail:{language:lang}}));
            toast(translateString(lang==='fr'?'Français activé':'Langue modifiée',lang));
          }
          function bindLanguageSelectors(){
            document.querySelectorAll('[data-rmp-language-selector],#profileLanguage').forEach(el=>{
              if(el.dataset.rmpLanguageBound==='1')return;
              el.dataset.rmpLanguageBound='1';
              el.addEventListener('change',()=>setAppLanguage(el.value));
            });
          }
          function logoutLocal'''
          html, n = set_re.subn(new_set, html, count=1)
          if n != 1:
              raise SystemExit('ERROR: could not patch setAppLanguage().')

          # 3b) Translate DOM inserted after initial rendering (modals, forms, module refreshes).
          if 'function startLanguageObserver()' not in html:
              marker = '\nfunction t(k){'
              observer = r'''
              let __rmpI18nObserver=null;
              function startLanguageObserver(){
                if(__rmpI18nObserver||typeof MutationObserver==='undefined')return;
                __rmpI18nObserver=new MutationObserver((mutations)=>{
                  let added=false;
                  for(const m of mutations){if(m.type==='childList'&&m.addedNodes?.length){added=true;break}}
                  if(!added)return;
                  clearTimeout(startLanguageObserver._timer);
                  startLanguageObserver._timer=setTimeout(()=>{
                    try{bindLanguageSelectors();applyLanguage();applyFullLanguage()}catch(e){console.error('language observer',e)}
                  },0);
                });
                __rmpI18nObserver.observe(document.body,{childList:true,subtree:true});
              }
              '''
              if marker in html:
                  html = html.replace(marker, observer+marker, 1)
              else:
                  raise SystemExit('ERROR: translation insertion point not found.')

          # 3c) Ensure bindings/observer start on every app boot.
          html = html.replace('function boot(){migrateStorageKey();ensureExtendedState();', 'function boot(){bindLanguageSelectors();startLanguageObserver();migrateStorageKey();ensureExtendedState();', 1)

          # 4) Bust the service-worker registration URL.
          html = html.replace('sw.js?v=25.9.3', 'sw.js?v=25.9.9').replace('sw.js?v=25.9.4', 'sw.js?v=25.9.9')
          app.write_text(html, encoding='utf-8')

          # 5) Version all runtime metadata.
          if sw.exists():
              sw_text=sw.read_text(encoding='utf-8')
              sw_text=re.sub(r'remaprohub-v25-9-[0-9]+-0', 'remaprohub-v25-9-9-0', sw_text)
              sw.write_text(sw_text, encoding='utf-8')
          for p in (manifest, package):
              data=json.loads(p.read_text(encoding='utf-8'))
              data['version']='25.9.9'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          Path('VERSION_V25_9_9.md').write_text('# ReMaPro Hub V25.9.9\n\nInstaller fix and deterministic language switching.\n', encoding='utf-8')
          print('V25.9.9 source patch: PASS')
          PY

      - name: Verify exact V25.9.9 source
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f app/sw.js
          test -f native/package.json
          test -f native/capacitor.config.ts
          grep -q "APP_VERSION='25.9.9'" app/index.html
          grep -q "const urlLang=new URLSearchParams(location.search).get('lang')" app/index.html
          grep -q "function bindLanguageSelectors" app/index.html
          grep -q 'sw.js?v=25.9.9' app/index.html
          grep -q 'remaprohub-v25-9-9-0' app/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          Path('/tmp/remapro-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          manifest=json.loads(Path('app/manifest.json').read_text(encoding='utf-8'))
          package=json.loads(Path('native/package.json').read_text(encoding='utf-8'))
          assert manifest.get('version')=='25.9.9', f"manifest version={manifest.get('version')}"
          assert package.get('version')=='25.9.9', f"native package version={package.get('version')}"
          assert "APP_VERSION='25.9.9'" in html
          assert "const urlLang=new URLSearchParams(location.search).get('lang')" in html
          assert 'function bindLanguageSelectors' in html
          assert 'function startLanguageObserver' in html
          assert 'aria-label' in html
          assert 'replace(/-([a-z])/g' in html
          print(f'Inline script blocks: {len(scripts)}')
          print('Metadata and language assertions: PASS')
          PY
          node --check /tmp/remapro-inline.js
          bash -n native/scripts/prepare-android.sh

      - name: Commit V25.9.9 to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit; source is already V25.9.9.'
          else
            git commit -m 'ReMaPro Hub V25.9.9 installer and language fix'
            git push origin HEAD:main
          fi
