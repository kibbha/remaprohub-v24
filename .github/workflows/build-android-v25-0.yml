name: Android ReMaPro Hub V25.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f native/package.json
          test -f native/capacitor.config.ts
          grep -q "APP_VERSION='25.0.0'" app/index.html
      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript and Capacitor
        working-directory: native
        run: |
          npx tsc --version
          npx cap --version
      - name: Create Android project
        working-directory: native
        run: npx cap add android
      - name: Generate Android assets
        working-directory: native
        run: npx @capacitor/assets generate --android --assetPath assets --androidProject android --iconBackgroundColor 3a2f28 --iconBackgroundColorDark 211c19
      - name: Prepare Android camera
        working-directory: native
        run: bash scripts/prepare-android.sh
      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android
      - name: Set Android version
        working-directory: native
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 25000',s,count=1)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "25.0.0"',s,count=1)
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: test -f native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ReMaPro-Hub-V25.0.0-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
