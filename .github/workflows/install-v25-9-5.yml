name: Install ReMaPro Hub V25.9.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Upgrade source to exact V25.9.5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          app = root / 'app' / 'index.html'
          sw = root / 'app' / 'sw.js'
          manifest = root / 'app' / 'manifest.json'
          package = root / 'native' / 'package.json'

          if not app.exists():
              raise SystemExit('ERROR: app/index.html is missing from the repository.')

          html = app.read_text(encoding='utf-8')
          m = re.search(r"const APP_VERSION='([0-9.]+)';", html)
          current = m.group(1) if m else 'unknown'
          print(f'Checked-out source version: {current}')

          if current not in {'25.9.3', '25.9.4', '25.9.5'}:
              raise SystemExit(f'ERROR: unsupported source version {current}. Expected 25.9.3, 25.9.4, or 25.9.5.')

          # 1) Version bump.
          html, n = re.subn(r"const APP_VERSION='[0-9.]+';", "const APP_VERSION='25.9.5';", html, count=1)
          assert n == 1

          # 2) Make boot locale deterministic: URL ?lang= has priority over storage.
          old_lang = r"const storedLang=localStorage\.getItem\('remaprohub-language'\);if\(storedLang&&I18N\[storedLang\]\)\{d\.preferences\.language=storedLang;d\.user\.language=storedLang;\}"
          new_lang = "const urlLang=new URLSearchParams(location.search).get('lang');const storedLang=localStorage.getItem('remaprohub-language');const preferredLang=(urlLang&&I18N[urlLang])?urlLang:storedLang;if(preferredLang&&I18N[preferredLang]){d.preferences.language=preferredLang;d.user.language=preferredLang;localStorage.setItem('remaprohub-language',preferredLang);}"
          html, n = re.subn(old_lang, new_lang, html, count=1)
          if n == 0 and 'const urlLang=new URLSearchParams(location.search).get(\'lang\')' not in html:
              raise SystemExit('ERROR: could not patch loadState() language selection.')

          # 3) Replace the language handler as one unit so it cannot depend on partial DOM translation.
          set_re = re.compile(r"function setAppLanguage\(lang\)\{.*?\n\}\nfunction logoutLocal", re.S)
          new_set = '''function setAppLanguage(lang){
            lang=I18N[lang]?lang:'fr';
            state.preferences=state.preferences||{};
            state.user=state.user||{};
            state.preferences.language=lang;
            state.user.language=lang;
            try{localStorage.setItem('remaprohub-language',lang);localStorage.setItem('remaprohub-data',JSON.stringify(state));}catch(e){console.error('language persistence',e)}
            __translationCache.clear();
            __translationReverse=null;
            document.documentElement.lang=lang;
            const ap=document.getElementById('appLanguage');
            const pl=document.getElementById('profileLanguage');
            if(ap)ap.value=lang;
            if(pl)pl.value=lang;
            try{renderAll()}catch(e){console.error('language renderAll',e)}
            try{applyLanguage();applyFullLanguage()}catch(e){console.error('language immediate',e)}
            if(document.getElementById('onboarding')?.classList.contains('open')){try{renderOnboarding()}catch(e){console.error('onboarding language',e)}}
            window.dispatchEvent(new CustomEvent('remapro:languagechange',{detail:{language:lang}}));
            const target=new URL(location.href);
            target.searchParams.set('lang',lang);
            target.searchParams.set('v',APP_VERSION+'-'+Date.now());
            setTimeout(()=>{try{location.replace(target.href)}catch(e){location.href=target.href}},30);
          }
          function logoutLocal'''
          html, n = set_re.subn(new_set, html, count=1)
          if n != 1:
              raise SystemExit('ERROR: could not patch setAppLanguage().')

          # 4) Bust the service-worker registration URL.
          html = html.replace('sw.js?v=25.9.3', 'sw.js?v=25.9.5').replace('sw.js?v=25.9.4', 'sw.js?v=25.9.5')
          app.write_text(html, encoding='utf-8')

          # 5) Version all runtime metadata.
          if sw.exists():
              sw.write_text(sw.read_text(encoding='utf-8').replace('remaprohub-v25-9-3-0','remaprohub-v25-9-5-0').replace('remaprohub-v25-9-4-0','remaprohub-v25-9-5-0'), encoding='utf-8')
          for p in (manifest, package):
              data=json.loads(p.read_text(encoding='utf-8'))
              data['version']='25.9.5'
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          Path('VERSION_V25_9_5.md').write_text('# ReMaPro Hub V25.9.5\n\nInstaller fix and deterministic language switching.\n', encoding='utf-8')
          print('V25.9.5 source patch: PASS')
          PY

      - name: Verify exact V25.9.5 source
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/manifest.json
          test -f app/sw.js
          test -f native/package.json
          test -f native/capacitor.config.ts
          grep -q "APP_VERSION='25.9.5'" app/index.html
          grep -q "const urlLang=new URLSearchParams(location.search).get('lang')" app/index.html
          grep -q "target.searchParams.set('lang',lang)" app/index.html
          grep -q "target.searchParams.set('v',APP_VERSION+'-'" app/index.html
          grep -q 'sw.js?v=25.9.5' app/index.html
          grep -q 'remaprohub-v25-9-5-0' app/sw.js
          grep -q '"version": "25.9.5"' app/manifest.json
          grep -q '"version": "25.9.5"' native/package.json
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          Path('/tmp/remapro-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          json.loads(Path('app/manifest.json').read_text(encoding='utf-8'))
          json.loads(Path('native/package.json').read_text(encoding='utf-8'))
          print(f'Inline script blocks: {len(scripts)}')
          PY
          node --check /tmp/remapro-inline.js
          bash -n native/scripts/prepare-android.sh

      - name: Commit V25.9.5 to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit; source is already V25.9.5.'
          else
            git commit -m 'ReMaPro Hub V25.9.5 installer and language fix'
            git push origin HEAD:main
          fi
