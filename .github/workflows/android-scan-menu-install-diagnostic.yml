name: Diagnose Scan Menu IA APK installation (no rebuild)
on:
  push:
    branches: [rebuild/remaprohub-clean]
    paths: [.github/hub-scan-diagnostic.trigger]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Download existing APK without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/remapro-test
          gh run download 42198578981 --repo kibbha/remaprohub-v24 --name ReMaPro-Scan-Menu-IA-Standalone-APK --dir /tmp/remapro-test
          test -s /tmp/remapro-test/app-debug.apk
          ls -lh /tmp/remapro-test/app-debug.apk
      - name: Verify APK signing certificate, SDK, and APK alignment
        run: |
          APT="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$APT" verify --verbose --print-certs /tmp/remapro-test/app-debug.apk
          "$AAPT" dump badging /tmp/remapro-test/app-debug.apk | head -25
          "$ZIPALIGN" -c -P 16 -v 4 /tmp/remapro-test/app-debug.apk | tail -3
      - name: Try install on a clean Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install /tmp/remapro-test/app-debug.apk
            adb shell pm path com.remaprohub.scanmenu
