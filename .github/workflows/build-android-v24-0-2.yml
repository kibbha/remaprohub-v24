name: Android V24.0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap source from ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app/index.html ]; then
            ZIP="ReMaPro_Hub_V24_0_2_READY.zip"
            test -f "$ZIP" || { echo "Source absente et ZIP V24.0.2 introuvable"; ls -la; exit 1; }
            rm -rf /tmp/remapro
            mkdir -p /tmp/remapro
            unzip -q "$ZIP" -d /tmp/remapro
            APP_INDEX=$(find /tmp/remapro -type f -path '*/app/index.html' -print -quit)
            test -n "$APP_INDEX" || { echo "app/index.html introuvable dans le ZIP"; exit 1; }
            ROOT=$(dirname "$(dirname "$APP_INDEX")")
            cp -a "$ROOT/." .
          fi

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f native/package.json
          test -f native/capacitor.config.ts
          grep -q '24.0.2' app/index.html
          grep -q '24.0.2' native/package.json
          grep -q '"typescript"' native/package.json
          test -f app/icons/remaprohub-192.png
          test -f app/icons/remaprohub-512.png
          test -f app/icons/remaprohub-512-maskable.png
          echo "Source V24.0.2 OK"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        working-directory: native
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify TypeScript toolchain
        working-directory: native
        run: |
          npx tsc --version
          npx cap --version

      - name: Create fresh Android project
        working-directory: native
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android

      - name: Generate Android assets
        working-directory: native
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --androidProject android \
            --iconBackgroundColor 3a2f28 \
            --iconBackgroundColorDark 211c19

      - name: Apply Android preparation
        working-directory: native
        run: bash scripts/prepare-android.sh

      - name: Sync Capacitor
        working-directory: native
        run: npx cap sync android

      - name: Validate Android manifest
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml: XML OK')
          PY

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-Hub-V24.0.2-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
