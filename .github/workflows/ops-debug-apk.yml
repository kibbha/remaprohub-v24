name: Android ReMaPro Ops V0.1.0 Test APK

on:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/ops-debug-apk.trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/remapro-ops

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inject runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/inject-runtime-config.mjs

      - name: Run Ops tests
        run: npm test

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Stamp Android version
        run: node scripts/stamp-android-version.mjs

      - name: Apply immersive Ops activity
        run: |
          install -m 644 android-native/OpsMainActivity.java android/app/src/main/java/com/remaprohub/ops/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.systemBars()' android/app/src/main/java/com/remaprohub/ops/MainActivity.java

      - name: Synchronize native runtime
        run: npx cap sync android

      - name: Harden Android runtime
        run: |
          node scripts/harden-android.mjs
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml

      - name: Apply ReMaPro Ops Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          install -m 644 android-native/remaproops_foreground.xml android/app/src/main/res/drawable/remaproops_foreground.xml
          install -m 644 android-native/ops_ic_launcher_legacy.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          install -m 644 android-native/ops_ic_launcher_legacy.xml android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          install -m 644 android-native/ops_ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          install -m 644 android-native/ops_ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          install -m 644 android-native/remaproops_colors.xml android/app/src/main/res/values/remaproops_colors.xml
          grep -q '#2F5E68' android/app/src/main/res/values/remaproops_colors.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-Ops-V0.1.0-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
