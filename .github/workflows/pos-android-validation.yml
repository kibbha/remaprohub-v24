name: Android ReMaPro POS V0.27.0 Beta Validation

on:
  workflow_dispatch:
  push:
    branches: [pos/remapro-pos]
    paths:
      - '.github/pos-android-validation.trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pos/remapro-pos

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install exact POS dependencies
        run: npm install --no-audit --no-fund

      - name: Inject public Supabase runtime config
        run: npm run inject:config

      - name: Run POS smoke and layout tests
        run: npm test

      - name: Prepare packaged web runtime
        run: |
          npm run prepare:web
          test -s app/index.html
          test -s app/runtime-config.js
          test -s app/src/app.js
          test -s app/src/cloud.js
          test -s app/src/db.js
          test -s app/src/printer.js
          test -s app/src/layout.js

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Stamp Android version
        run: |
          node scripts/stamp-android-version.mjs
          grep -q 'versionName "0.27.0"' android/app/build.gradle

      - name: Add ReMaPro network ESC/POS bridge and immersive fullscreen
        run: |
          node scripts/patch-network-printer.mjs
          grep -q 'registerPlugin(NetworkPrinterPlugin.class)' android/app/src/main/java/com/remaprohub/pos/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.systemBars()' android/app/src/main/java/com/remaprohub/pos/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' android/app/src/main/java/com/remaprohub/pos/MainActivity.java
          grep -q '@CapacitorPlugin(name = "NetworkPrinter")' android/app/src/main/java/com/remaprohub/pos/NetworkPrinterPlugin.java

      - name: Synchronize native plugins
        run: npx cap sync android

      - name: Apply ReMaPro POS Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          install -m 644 android-native/remapropos_foreground.xml android/app/src/main/res/drawable/remapropos_foreground.xml
          install -m 644 android-native/ic_launcher_legacy.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          install -m 644 android-native/ic_launcher_legacy.xml android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          install -m 644 android-native/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          install -m 644 android-native/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          install -m 644 android-native/remapropos_colors.xml android/app/src/main/res/values/remapropos_colors.xml
          grep -q '#C75232' android/app/src/main/res/values/remapropos_colors.xml
          grep -q '@drawable/remapropos_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Verify packaged Android runtime and native plugins
        run: |
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/src/app.js
          test -s android/app/src/main/assets/public/src/layout.js
          grep -Rqi "sqlite" android/capacitor.settings.gradle android/app/capacitor.build.gradle
          grep -Rqi "secure" android/capacitor.settings.gradle android/app/capacitor.build.gradle
          grep -Rqi "printer\|esc" android/capacitor.settings.gradle android/app/capacitor.build.gradle

      - name: Build debug beta APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK and 16 KB zip alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-POS-V0.27.0-beta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
