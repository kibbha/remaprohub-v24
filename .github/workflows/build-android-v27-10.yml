name: Android ReMaPro Hub V27.10.0 Manual
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/remaprohub-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Inject production runtime config
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/inject-runtime-config.mjs
      - run: npm test
      - name: Verify packaged web runtime
        run: |
          test -s app/sw.js
          test -s app/src/app.js
          test -s app/src/restored.js
          test -s app/src/i18n.js
          test -s app/src/store.js
          test -s app/src/legal.js
          test -s app/src/billing.js
          test -s app/src/security.js
      - run: npx cap add android
      - name: Stamp Android version
        run: node scripts/stamp-android-version.mjs
      - name: Apply immersive Android activity
        run: |
          install -m 644 android-native/MainActivity.java android/app/src/main/java/com/remaprohub/app/MainActivity.java
          grep -q 'WindowInsetsCompat.Type.systemBars()' android/app/src/main/java/com/remaprohub/app/MainActivity.java
      - run: npx cap sync android
      - name: Harden Android for Google Play
        run: |
          node scripts/harden-android.mjs
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTop"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_BIOMETRIC' android/app/src/main/AndroidManifest.xml
      - name: Enable camera capture
        run: |
          node scripts/patch-android-camera.mjs
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml valid')
          PY
      - name: Apply ReMaPro Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          install -m 644 app/assets-remaprohub-logo.png android/app/src/main/res/drawable-nodpi/remaprohub_logo.png
          install -m 644 android-native/remaprohub_foreground.xml android/app/src/main/res/drawable/remaprohub_foreground.xml
          install -m 644 android-native/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          install -m 644 android-native/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          install -m 644 android-native/remaprohub_colors.xml android/app/src/main/res/values/remaprohub_colors.xml
      - name: Verify packaged runtime
        run: |
          test -s android/app/src/main/assets/public/src/app.js
          test -s android/app/src/main/assets/public/src/restored.js
          test -s android/app/src/main/assets/public/src/i18n.js
          test -s android/app/src/main/assets/public/src/store.js
          test -s android/app/src/main/assets/public/src/legal.js
          test -s android/app/src/main/assets/public/src/billing.js
          test -s android/app/src/main/assets/public/src/security.js
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify 16 KB zip alignment
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release AAB when signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing secrets not configured; release AAB skipped."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remapro-release.jks"
          cd android
          ./gradlew bundleRelease
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/remapro-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-Hub-V27.10.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ReMaPro-Hub-V27.10.0-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
