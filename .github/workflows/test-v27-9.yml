name: Test ReMaPro Hub V27.9
on:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/test-v27-9-trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
