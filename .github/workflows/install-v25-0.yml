name: Install ReMaPro Hub V25.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Locate and validate package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'ReMaPro_Hub_V25_0_READY.zip' -print -quit)"
          test -n "$ZIP" || { echo "::error::ReMaPro_Hub_V25_0_READY.zip introuvable"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          rm -rf "$RUNNER_TEMP/remapro-v25"
          mkdir -p "$RUNNER_TEMP/remapro-v25"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/remapro-v25"
          ROOT="$(find "$RUNNER_TEMP/remapro-v25" -type f -path '*/app/index.html' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$ROOT"; test -f "$ROOT/app/index.html"; test -f "$ROOT/native/package.json"; test -f "$ROOT/app/manifest.json"; test -f "$ROOT/app/sw.js"
          grep -q "APP_VERSION='25.0.0'" "$ROOT/app/index.html"
          grep -q '"version": "25.0.0"' "$ROOT/app/manifest.json"
          grep -q 'remaprohub-v25-0-0' "$ROOT/app/sw.js"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app native supabase
          cp -a "$ROOT/app" app
          cp -a "$ROOT/native" native
          cp -a "$ROOT/supabase" supabase
          find "$ROOT" -maxdepth 1 -type f -name '*.md' -exec cp {} . \;
          cp "$ROOT/update-manifest.json" .
          rm -f ReMaPro_Hub_V25_0_READY.zip
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/documents/catalogue.json
          test -f native/package.json
          test -f native/capacitor.config.ts
          test -f supabase/functions/remapro-ai/index.ts
          grep -q 'remaprohub-data' app/index.html
          grep -q '23 documents' app/index.html
          grep -q 'calcSalary' app/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/rmp.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/rmp.js
      - name: Commit V25.0.0
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Install ReMaPro Hub V25.0.0 complete foundation'
          git push origin HEAD:main
