name: Install ReMaPro Hub V25.1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Locate and validate package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'ReMaPro_Hub_V25_1_1_READY.zip' -print -quit)"
          test -n "$ZIP" || { echo "::error::ReMaPro_Hub_V25_1_1_READY.zip introuvable"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          rm -rf "$RUNNER_TEMP/remapro-v25"
          mkdir -p "$RUNNER_TEMP/remapro-v25"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/remapro-v25"
          ROOT="$(find "$RUNNER_TEMP/remapro-v25" -type f -path '*/app/index.html' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$ROOT"
          test -f "$ROOT/app/index.html"
          test -f "$ROOT/app/manifest.json"
          test -f "$ROOT/app/sw.js"
          test -f "$ROOT/native/package.json"
          test -f "$ROOT/native/capacitor.config.ts"
          test -f "$ROOT/native/scripts/prepare-android.sh"
          test -f "$ROOT/supabase/functions/remapro-ai/index.ts"
          grep -q "APP_VERSION='25.1.1'" "$ROOT/app/index.html"
          grep -q '"version": "25.1.1"' "$ROOT/app/manifest.json"
          grep -q 'remaprohub-v25-1-1' "$ROOT/app/sw.js"
          grep -q 'function openStockModal' "$ROOT/app/index.html"
          grep -q 'function openRecipeModal' "$ROOT/app/index.html"
          grep -q 'function openTempModal' "$ROOT/app/index.html"
          grep -q 'function openStaffModal' "$ROOT/app/index.html"
          grep -q 'function renderSales' "$ROOT/app/index.html"
          grep -q 'function renderPurchases' "$ROOT/app/index.html"
          grep -q 'function renderTraceability' "$ROOT/app/index.html"
          grep -q 'function renderWaste' "$ROOT/app/index.html"
          grep -q 'function renderReservations' "$ROOT/app/index.html"
          grep -q 'function openAllModules' "$ROOT/app/index.html"
          grep -q 'function analyzeStockPhoto' "$ROOT/app/index.html"
          grep -q 'function openMaintenanceModal' "$ROOT/app/index.html"
          grep -q 'function openBriefingModal' "$ROOT/app/index.html"
          grep -q 'function openHandoverModal' "$ROOT/app/index.html"
          grep -q 'function openCashCheckModal' "$ROOT/app/index.html"
          grep -q 'function openWeeklyKPIModal' "$ROOT/app/index.html"
          grep -q 'function openComplianceItemModal' "$ROOT/app/index.html"
          grep -q 'function openIncidentModal' "$ROOT/app/index.html"
          ! grep -q 'Module prêt à être utilisé' "$ROOT/app/index.html"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app native supabase
          cp -a "$ROOT/app" app
          cp -a "$ROOT/native" native
          cp -a "$ROOT/supabase" supabase
          find "$ROOT" -maxdepth 1 -type f -name '*.md' -exec cp {} . \;
          cp "$ROOT/update-manifest.json" .
          rm -f ReMaPro_Hub_V25_1_1_READY.zip
      - name: Verify installed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/index.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/remapro.js').write_text(js)
          funcs=set(re.findall(r'function\s+([A-Za-z_$][\w$]*)\s*\(',js))
          attrs=re.findall(r'on(?:click|change|input|load|error|dragstart|dragover|drop)="([^"]*)"',s)
          used=set()
          for a in attrs: used.update(re.findall(r'(?<![.\w])([A-Za-z_$][\w$]*)\s*\(',a))
          known={'confirm','alert','setTimeout','setInterval','clearTimeout','clearInterval','URL','document','window','console','fetch','Number','String','Date','JSON','Object','Array','Math','Intl','FileReader','encodeURIComponent','decodeURIComponent'}
          missing=sorted(used-funcs-known)
          assert not missing, missing
          views=set(re.findall(r'<section id="([^"]+)" class="view(?: active)?"',s))
          nav=set(re.findall(r"\['([^']+)'",s[s.find('const navItems='):s.find('];',s.find('const navItems='))+2]))
          assert views >= nav, sorted(nav-views)
          print(f'Navigation/view audit: {len(nav)} nav items, {len(views)} views — PASS')
          assert 'Module prêt à être utilisé' not in s
          print('Functional static audit: PASS')
          PY
          node --check /tmp/remapro.js
          bash -n native/scripts/prepare-android.sh
          grep -q '"version": "25.1.1"' native/package.json
          grep -q 'typescript' native/package.json
      - name: Commit V25.1.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'ReMaPro Hub V25.1.1 functional complete test base'
          git push origin HEAD:main
