name: Configure ReMaPro Auth Redirect
on:
  push:
    branches: [rebuild/remaprohub-clean]
    paths:
      - '.github/auth-redirect-trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: gkbzawjlmwjweuqckuxm
      SITE_URL: https://gkbzawjlmwjweuqckuxm.supabase.co/functions/v1/remapro-auth-return
    steps:
      - name: Validate token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured"; exit 2; }
      - name: Read current auth URL config
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             | jq '{site_url,uri_allow_list}'
      - name: Update auth Site URL
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg site "$SITE_URL" '{site_url:$site,uri_allow_list:$site}')"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth"             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             | jq '{site_url,uri_allow_list}'
      - name: Verify localhost removed
        shell: bash
        run: |
          set -euo pipefail
          cfg="$(curl -fsS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          echo "$cfg" | jq '{site_url,uri_allow_list}'
          test "$(echo "$cfg" | jq -r '.site_url')" = "$SITE_URL"
          ! echo "$cfg" | jq -r '.site_url,.uri_allow_list' | grep -q 'localhost'
