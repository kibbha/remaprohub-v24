name: Install ReMaPro Hub V25.5.2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Locate and validate package
        run: |
          set -euo pipefail
          ZIP="$(find . -type f -name 'ReMaPro_Hub_V25_5_2_READY.zip' -print -quit)"
          test -n "$ZIP"
          unzip -t "$ZIP" >/dev/null
          rm -rf "$RUNNER_TEMP/remapro-v25" && mkdir -p "$RUNNER_TEMP/remapro-v25"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/remapro-v25"
          ROOT="$(find "$RUNNER_TEMP/remapro-v25" -type f -path '*/app/index.html' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -f "$ROOT/app/index.html"
          grep -q "APP_VERSION='25.5.2'" "$ROOT/app/index.html"
          grep -q 'function goBack' "$ROOT/app/index.html"
          grep -q 'pageBackBtn' "$ROOT/app/index.html"
          grep -q 'WindowInsets.Type.navigationBars' "$ROOT/native/scripts/prepare-android.sh"
          ! grep -q 'onResume' "$ROOT/native/scripts/prepare-android.sh"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Install clean source
        run: |
          set -euo pipefail
          rm -rf app native supabase
          cp -a "$ROOT/app" app; cp -a "$ROOT/native" native; cp -a "$ROOT/supabase" supabase
          find "$ROOT" -maxdepth 1 -type f -name '*.md' -exec cp {} . \;
          cp "$ROOT/update-manifest.json" .
      - name: Verify installed source
        run: |
          set -euo pipefail
          grep -q "APP_VERSION='25.5.2'" app/index.html
          grep -q 'function goBack' app/index.html
          grep -q 'function goHome' app/index.html
          grep -q 'pageBackBtn' app/index.html
          ! grep -q 'data-rmp-data-rmp-onclick' app/index.html
          node --check <(sed -n '/<script>/,/<\/script>/p' app/index.html | sed '1d;$d')
          bash -n native/scripts/prepare-android.sh
      - name: Commit V25.5.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'ReMaPro Hub V25.5.2 Android fullscreen compile fix'
          git push origin HEAD:main
